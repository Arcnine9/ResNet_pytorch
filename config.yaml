# 配置
net: InceptionV3  # 网络模型选择(ResNet18, ResNet34, ResNet50, ResNet101, ResNet152, InceptionV3)
class_path: /models/train7_data/DNN_data/classes.txt  # 标签文件路径（已修正双斜杠）
width: 224
height: 224
train:
  epoch: 10  # 遍历数据集次数
  pre_epoch: 0  # 定义已经遍历数据集的次数
  batch_size: 128  # 批处理尺寸(batch_size)
  lr: 0.001  # 学习率
  train_data: /models/train7_data/DNN_data  # 训练集路径（已修改）
  test_data: /models/train7_data/DNN_data  # 测试集路径（已修改）
  is_gpu: True  # 是否使用gpu（NPU环境下保持True，transfer_to_npu会处理）
  num_workers: 8  # 并行处理数据进程数
  out_model_path: /models/train7_data/DNN_data/model  # 模型保存地址（改为当前目录下，避免权限问题）
  rotating: False # 训练过程是否进行图片随机旋转
test:
  model_path: /models/train7_data/DNN_data/model  # 测试所用的模型路径（同步修改）
  is_gpu: True  # 是否使用gpu